trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
    - job: BuildJob
    steps:
        - script: echo "Build stage - fetching secrets from KeyVault"
      displayName: 'Build'

- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  jobs:
    - job: TestJob
    steps:
        - script: echo "Test stage - Unit tests"
      displayName: 'Test'

- stage: SonarQube
  displayName: 'SonarQube Analysis'
  dependsOn: Test
  jobs:
    - job: SonarJob
    steps:
        - script: echo "SonarQube code quality check with KeyVault secret"
      displayName: 'SonarQube'

- stage: Dependency_Scan
  displayName: 'Dependency Scan'
  dependsOn: SonarQube
  jobs:
    - job: DepScanJob
    steps:
        - script: echo "Dependency scan - no hardcoded secrets"
      displayName: 'Dependency Scan'

- stage: Package
  displayName: 'Package Stage'
  dependsOn: Dependency_Scan
  jobs:
    - job: PackageJob
    steps:
        - script: echo "Package artifact"
      displayName: 'Package'

- stage: DEV
  displayName: 'DEV Deploy'
  dependsOn: Package
  jobs:
    - deployment: DeployDEV
    environment: 'DEV'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy to DEV"

- stage: QA
  displayName: 'QA Deploy'
  dependsOn: DEV
  jobs:
    - deployment: DeployQA
    environment: 'QA'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy to QA"

- stage: PROD
  displayName: 'PROD Deploy'
  dependsOn: QA
  jobs:
    - deployment: DeployPROD
    environment: 'PROD'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploy to PROD"
