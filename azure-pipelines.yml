trigger:
- main
pool:
  vmImage: 'ubuntu-latest'
steps:
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean compile'
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'test'
- script: echo SonarQube done
- script: echo Dependency Scan done
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
