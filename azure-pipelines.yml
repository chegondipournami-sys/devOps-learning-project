trigger:
- main
pool:
  vmImage: ubuntu-latest
stages:
- stage: Build
  jobs:
    - job: BuildJob
    steps:
        - script: echo Build done
      displayName: Build
- stage: Test
  dependsOn: Build
  jobs:
    - job: TestJob
    steps:
        - script: echo Test done
      displayName: Test
- stage: SecurityScan
  dependsOn: Test
  jobs:
    - job: ScanJob
    steps:
        - script: echo Security Scan done
      displayName: Scan
