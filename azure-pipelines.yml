trigger:main
pool:
vmImage: 'ubuntu-latest'
stages:stage: Build
jobs:job: Build
steps:script: echo Buildstage: Test
dependsOn: Build
jobs:job: Test
steps:script: echo Teststage: SonarQube
dependsOn: Test
jobs:job: Sonar
steps:script: echo Sonarstage: Dependency_Scan
dependsOn: SonarQube
jobs:job: Scan
steps:script: echo Scanstage: Package
dependsOn: Dependency_Scan
jobs:job: Package
steps:script: echo Packagestage: DEV
dependsOn: Package
jobs:deployment: DEV
environment: DEV
strategy:
  runOnce:javascriptdeploy:
  steps:
  - script: echo DEVstage: QA
dependsOn: DEV
jobs:deployment: QA
environment: QA
strategy:
  runOnce:javascriptdeploy:
  steps:
  - script: echo QAstage: PROD
dependsOn: QA
jobs:deployment: PROD
environment: PROD
strategy:
  runOnce:javascriptdeploy:
  steps:
  - script: echo PROD
