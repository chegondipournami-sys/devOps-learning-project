trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
    - job: Build
    steps:
        - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean compile'
        publishJUnitResults: false

- stage: Test
  dependsOn: Build
  jobs:
    - job: Test
    steps:
        - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'test'
        publishJUnitResults: true

- stage: SonarQube
  dependsOn: Test
  jobs:
    - job: SonarQube_Analysis
    steps:
        - script: |
        echo "Running SonarQube Analysis..."
        echo "Fetching sonar token from Azure KeyVault"
      displayName: 'SonarQube Analysis'

- stage: Dependency_Scan
  dependsOn: SonarQube
  jobs:
    - job: DependencyCheck
    steps:
        - script: |
        echo "Running Dependency Vulnerability Scan..."
        echo "Secrets fetched securely from KeyVault - not hardcoded"
      displayName: 'Dependency Scan'

- stage: Package
  dependsOn: Dependency_Scan
  jobs:
    - job: Package
    steps:
        - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'
        publishJUnitResults: false
        - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: DEV
  dependsOn: Package
  jobs:
    - deployment: DeployToDEV
    environment: 'DEV'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploying to DEV environment"

- stage: QA
  dependsOn: DEV
  jobs:
    - deployment: DeployToQA
    environment: 'QA'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploying to QA environment"

- stage: PROD
  dependsOn: QA
  jobs:
    - deployment: DeployToPROD
    environment: 'PROD'
    strategy:
      runOnce:
        deploy:
          steps:
                    - script: echo "Deploying to PROD environment"
