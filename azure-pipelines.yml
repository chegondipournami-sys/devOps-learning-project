trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
    - job: Build_Job
    steps:
        - task: Maven@4
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean compile'

- stage: Test
  dependsOn: Build
  jobs:
    - job: Test_Job
    steps:
        - task: Maven@4
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'test'

- stage: SonarQube
  dependsOn: Test
  jobs:
    - job: SonarQube_Scan
    steps:
        - script: echo "Running SonarQube Scan - Static Code & Security Analysis"
      displayName: 'SonarQube Scan'

- stage: Dependency_Scan
  dependsOn: SonarQube
  jobs:
    - job: Dependency_Scan
    steps:
        - script: echo "Checking vulnerable libraries - Secrets from KeyVault (Not hard-coded)"
      displayName: 'Dependency Scan'

- stage: Package
  dependsOn: Dependency_Scan
  jobs:
    - job: Package_Job
    steps:
        - task: Maven@4
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'

- stage: DEV
  dependsOn: Package
  jobs:
    - job: Deploy_DEV
    steps:
        - script: echo "Deploying to DEV Environment"
      displayName: 'DEV Deployment'

- stage: QA
  dependsOn: DEV
  jobs:
    - job: Deploy_QA
    steps:
        - script: echo "Deploying to QA Environment"
      displayName: 'QA Deployment'

- stage: PROD
  dependsOn: QA
  jobs:
    - job: Deploy_PROD
    steps:
        - script: echo "Deploying to PROD after manual Approval - Secure deployment"
      displayName: 'PROD Deployment with Approval'